name: Render universe
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python render.py
      - uses: actions/upload-artifact@v4
        with:
          name: ontogenesis-render
          path: gallery/
          retention-days: 30
