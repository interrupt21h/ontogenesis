name: Render universe
on:
  push:
    paths:
      - render.py
      - experiments/0001.json
      - requirements.txt
      - .github/workflows/render.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python render.py
      - uses: actions/upload-artifact@v6
        with:
          name: ontogenesis-render
          path: gallery/
          retention-days: 30
