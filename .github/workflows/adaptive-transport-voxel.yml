name: G0029 cinematic voxel reprocessing
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Film duration, 6-180 seconds'
        type: number
        default: 60
      publish:
        description: 'Publish separately named film/poster in atlas-media (never changes featured video)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'adaptive_transport_voxel_render.py'
      - 'tests/test_adaptive_transport_voxel_render.py'
      - '.github/workflows/adaptive-transport-voxel.yml'
permissions:
  contents: read
concurrency:
  group: g0029-voxel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  voxel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned renderer (no simulation)
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 pillow==11.2.1
          if ! command -v ffmpeg >/dev/null 2>&1 || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg fonts-dejavu-core
          fi
      - name: Verify source and cinematic smoke tests
        run: |
          python -m compileall -q adaptive_transport_voxel_render.py
          python -m unittest discover -s tests -p test_adaptive_transport_voxel_render.py -v
      - name: Retrieve preserved verified numerical observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh release download atlas-media -p 'g0029-full.npz' -p 'g0029-full.json' -D input
          test -s input/g0029-full.npz
          test -s input/g0029-full.json
      - name: Render G0028-style G0029 film from archived fields
        env:
          SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.seconds || 60 }}
        run: |
          /usr/bin/time -v python -u adaptive_transport_voxel_render.py \
            --input input/g0029-full.npz --metadata input/g0029-full.json \
            --movie ontogenesis-0029-voxel-cinematic.mp4 \
            --poster ontogenesis-0029-voxel-cinematic.png \
            --seconds "$SECONDS" --fps 24 --width 1280 --height 720
      - name: Verify film length and provenance
        env:
          SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.seconds || 60 }}
        run: |
          ffmpeg -v error -xerror -i ontogenesis-0029-voxel-cinematic.mp4 -f null -
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames -of json ontogenesis-0029-voxel-cinematic.mp4 > probe.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          j=json.loads(Path('ontogenesis-0029-voxel-cinematic.render.json').read_text())
          m=json.loads(Path('input/g0029-full.json').read_text())
          p=json.loads(Path('probe.json').read_text())
          expected=int(os.environ['SECONDS'])*24
          assert j['generation']=='0029' and j['edition']=='voxel-cinema-g0028-style'
          assert j['frames']==expected==int(p['streams'][0]['nb_read_frames'])
          assert j['archive_sha256']==m['archive']['sha256']
          assert j['unique_sampled_frame_hashes']>=6
          assert j['selected_featured_film'] is False
          assert Path('ontogenesis-0029-voxel-cinematic.png').stat().st_size>4096
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: g0029-cinematic-voxel-render
          path: |
            ontogenesis-0029-voxel-cinematic.mp4
            ontogenesis-0029-voxel-cinematic.png
            ontogenesis-0029-voxel-cinematic.render.json
            probe.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish alternate edition to atlas-media
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload atlas-media \
            ontogenesis-0029-voxel-cinematic.mp4 \
            ontogenesis-0029-voxel-cinematic.png \
            ontogenesis-0029-voxel-cinematic.render.json --clobber
          echo '[G0029 voxel cinema (G0028 aesthetic)](https://github.com/${{ github.repository }}/releases/download/atlas-media/ontogenesis-0029-voxel-cinematic.mp4)' >> "$GITHUB_STEP_SUMMARY"
