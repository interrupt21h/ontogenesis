name: G0034 Luminous Habitat art-directed native 4D film
on:
  push:
    branches: [main]
    paths:
      - 'g0034_luminous_habitat.py'
      - 'tests/test_g0034_luminous_habitat.py'
      - '.github/workflows/g0034-luminous-habitat.yml'
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: 'Verified G0033 native numerical evidence run'
        type: string
        default: '45437009050'
permissions:
  contents: read
  actions: read
concurrency:
  group: g0034-luminous-habitat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cinematic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned artistic-render and numerical dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 matplotlib==3.10.3 pillow==11.2.1 imageio-ffmpeg==0.8.1
      - name: Test exact native filaments and cinematic state framing
        run: |
          python -m compileall -q g0034_luminous_habitat.py
          python -m unittest discover -s tests -p test_g0034_luminous_habitat.py -v
      - name: Fetch original successful G0033 field archive
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.evidence_run_id || '45437009050' }}
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion,name \
            --jq 'if .conclusion == "success" and .name == "G0033 eight-seed native 4D interface robustness pilot" then .name else error("Unverified numerical source") end'
          mkdir -p input
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" \
            -n g0033-seed-73-native-evidence -D input
          gh release download atlas-media -p g0033-robustness.json -D input
      - name: Authenticate full 4D archive against numerical publication
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          archive=Path('input/g0033-seed-73.npz')
          meta=json.loads(Path('input/g0033-seed-73.native.json').read_text())
          pilot=json.loads(Path('input/g0033-robustness.json').read_text())
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert pilot['generation']=='0033' and pilot['seeds']==[42,73,101,137,211,307,401,509]
          assert digest==meta['archive_sha256']==pilot['source_archive_sha256_by_seed']['73']
          assert meta['n']==16 and meta['steps']==240 and meta['seed']==73
          PY
      - name: Smoke encode complete three-act artistic geometry
        run: |
          python -u g0034_luminous_habitat.py \
            --archive input/g0033-seed-73.npz \
            --metadata input/g0033-seed-73.native.json \
            --movie /tmp/g0034-habitat-smoke.mp4 \
            --poster /tmp/g0034-habitat-smoke.png \
            --seconds 2 --fps 8
          python - <<'PY'
          import imageio_ffmpeg
          count,seconds=imageio_ffmpeg.count_frames_and_secs('/tmp/g0034-habitat-smoke.mp4')
          assert count==16 and abs(seconds-2)<.1
          reader=imageio_ffmpeg.read_frames('/tmp/g0034-habitat-smoke.mp4')
          header=next(reader);reader.close()
          assert tuple(header['size'])==(1280,720)
          PY
      - name: Produce 24-second 720p art-directed Luminous Habitat film
        run: |
          /usr/bin/time -v python -u g0034_luminous_habitat.py \
            --archive input/g0033-seed-73.npz \
            --metadata input/g0033-seed-73.native.json \
            --movie ontogenesis-0034-luminous-habitat.mp4 \
            --poster ontogenesis-0034-luminous-habitat.png \
            --seconds 24 --fps 24
      - name: Validate the encoded master and truthful render metadata
        run: |
          python - <<'PY'
          import hashlib,imageio_ffmpeg,json
          from pathlib import Path
          base=Path('ontogenesis-0034-luminous-habitat')
          meta=json.loads(base.with_suffix('.render.json').read_text())
          digest=hashlib.sha256(Path('input/g0033-seed-73.npz').read_bytes()).hexdigest()
          assert meta['edition']=='luminous-habitat-native-field-cinema-v1'
          assert meta['source_archive_sha256']==digest and meta['seed']==73
          assert meta['interpolated_numerical_states'] is False
          assert meta['organisms_inferred'] is False
          assert [item['act'] for item in meta['review_samples']]==[0,1,2,2]
          count,duration=imageio_ffmpeg.count_frames_and_secs(str(base.with_suffix('.mp4')))
          assert count==576 and abs(duration-24)<.1
          reader=imageio_ffmpeg.read_frames(str(base.with_suffix('.mp4')))
          header=next(reader);reader.close()
          assert tuple(header['size'])==(1280,720)
          assert base.with_suffix('.png').stat().st_size>4096
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: g0034-native-four-dimensional-luminous-habitat-art-film
          path: |
            ontogenesis-0034-luminous-habitat.mp4
            ontogenesis-0034-luminous-habitat.png
            ontogenesis-0034-luminous-habitat.render.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish authenticated, art-directed cinematic edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload atlas-media \
            ontogenesis-0034-luminous-habitat.mp4 \
            ontogenesis-0034-luminous-habitat.png \
            ontogenesis-0034-luminous-habitat.render.json --clobber
          echo "Luminous Habitat: verified native 4D light-and-filament cinematic." >> "$GITHUB_STEP_SUMMARY"
