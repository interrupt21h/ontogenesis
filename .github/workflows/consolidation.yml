name: Generation 0026 consolidation
on:
  workflow_dispatch:
    inputs:
      full_resolution:
        description: 'Run expensive 24^4 4800-step archived verification'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [consolidation.py, .github/workflows/consolidation.yml]
permissions:
  contents: read
concurrency:
  group: generation-0026
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6
      - run: python -u consolidation.py --verify --n 12 --steps 240 --out result.json
      - uses: actions/upload-artifact@v7
        with:
          name: observer-12
          path: result.json
          retention-days: 30
  full:
    if: github.event_name == 'workflow_dispatch' && inputs.full_resolution
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6
      - run: python -u consolidation.py --verify --n 24 --steps 4800 --out result.json
      - uses: actions/upload-artifact@v7
        with:
          name: observer-24
          path: result.json
          retention-days: 30
