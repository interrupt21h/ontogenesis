name: Generation 0022
on:
  push:
    paths:
      - niche.py
      - requirements.txt
      - .github/workflows/niche.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt scipy==1.15.3
      - run: python niche.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -y -framerate 24 -pattern_type glob -i 'gallery/0022/[0-9]*.png' -vf scale=1280:720 -c:v libx264 -pix_fmt yuv420p -crf 27 -movflags +faststart gallery/0022/evolution.mp4
      - run: ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,nb_frames -of json gallery/0022/evolution.mp4
      - uses: actions/upload-artifact@v7
        with:
          name: generation-0022
          path: |
            gallery/0022/metrics.json
            gallery/0022/lineages.json
            gallery/0022/04800.png
          retention-days: 30
          if-no-files-found: error
      - name: Upload standalone MP4
        id: video
        uses: actions/upload-artifact@v7
        with:
          path: gallery/0022/evolution.mp4
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Link animation
        run: echo '[Download MP4 directly](${{ steps.video.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
