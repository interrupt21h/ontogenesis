name: Generation 0002
on:
  push:
    paths:
      - diversification.py
      - render.py
      - requirements.txt
      - .github/workflows/diversification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python diversification.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -y -framerate 12 -pattern_type glob -i 'gallery/0002/[0-9]*.png' -vf scale=512:512:flags=neighbor -c:v libx264 -pix_fmt yuv420p -crf 25 -movflags +faststart gallery/0002/evolution.mp4
      - uses: actions/upload-artifact@v7
        with:
          name: generation-0002
          path: |
            gallery/0002/*.png
            gallery/0002/metrics.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload standalone MP4
        id: video
        uses: actions/upload-artifact@v7
        with:
          path: gallery/0002/evolution.mp4
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Link animation
        run: echo '[Download MP4 directly](${{ steps.video.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
