name: Publish Ontogenesis interactive GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['G0034 native 4D component genealogy and lineage cinema', 'G0035 Morphogenic Tide art and evidence cinematics', 'G0036 Feedback Aurora art and evidence cinematics', 'G0036 eight-seed matched structural-feedback replication']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate accessible film portal and release-aware display logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          page=Path('site/index.html').read_text()
          lab=Path('site/interface-lab.html').read_text()
          loom=Path('site/temporal-loom.html').read_text()
          lineage=Path('site/lineage-observatory.html').read_text()
          feedback=Path('site/feedback-lab.html').read_text()
          atlas=Path('docs/visual-atlas.html').read_text()
          assert '<html lang="en">' in page and '<main class="wrap">' in page
          assert 'id="player"' in page and 'id="cards"' in page
          assert 'id="film-picker"' in page and 'docs/visual-atlas.html' in page
          assert 'api.github.com/repos/interrupt21h/ontogenesis/releases/tags/atlas-media' in page
          assert 'available.get(entry.file)' in page
          assert page.count('gen:"003')>=8
          assert 'ontogenesis-0035-morphogenic-tide-art.mp4' in page
          assert 'ontogenesis-0035-morphogenic-tide-evidence.mp4' in page
          assert atlas.count('<article class="tile"')==32
          assert 'G0033' in page
          assert 'interface-lab.html' in page
          assert 'data/g0033-robustness.json' in lab
          assert 'four_dimensional_face_contacts' in lab
          assert 'data/g0033-temporal-loom.json' in loom
          assert 'eight-seed-measured-temporal-loom-v1' in loom
          assert 'data/g0034-genealogy.json' in lineage
          assert 'component_count' in lineage
          assert 'data/g0036-summary.json' in feedback
          assert 'data/g0036-replication.json' in feedback
          class Parser(HTMLParser):
              pass
          Parser().feed(page)
          Parser().feed(atlas)
          PY
      - name: Parse inline JavaScript independently for every static page
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inline = []
                  self.in_script = False
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.in_script = not dict(attrs).get('src')
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.in_script = False
              def handle_data(self, data):
                  if self.in_script:
                      self.inline.append(data)
          pages = ['index', 'interface-lab', 'temporal-loom',
                   'lineage-observatory', 'feedback-lab']
          for name in pages:
              parser = ScriptExtractor()
              parser.feed(Path('site', name + '.html').read_text())
              assert parser.inline, f'No executable JavaScript in {name}'
              Path('/tmp/ontogenesis-' + name + '.js').write_text(
                  '\n'.join(parser.inline))
          PY
          for page in index interface-lab temporal-loom lineage-observatory; do
            node --check "/tmp/ontogenesis-${page}.js"
          done
      - name: Assemble project-relative static site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/interface-lab.html _site/interface-lab.html
          cp site/temporal-loom.html _site/temporal-loom.html
          cp site/lineage-observatory.html _site/lineage-observatory.html
          cp site/feedback-lab.html _site/feedback-lab.html
          cp -a docs _site/docs
          touch _site/.nojekyll
          test -s _site/docs/visual-atlas.html
          test -s _site/index.html
      - name: Bundle verified G0033 numerical evidence for offline-capable static charts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/data
          gh release download atlas-media -p g0033-robustness.json -D _site/data
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('_site/data/g0033-robustness.json')
          d=json.loads(path.read_text())
          assert d["generation"]=="0033" and d["n"]==16 and d["steps"]==240
          assert d["seeds"]==[42,73,101,137,211,307,401,509]
          assert len(d["individual_endpoints"])==8
          assert len(d["source_archive_sha256_by_seed"])==8
          PY
      - name: Bundle verified temporal traces after cinematic publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/data
          if gh release download atlas-media -p g0033-temporal-loom.json -D _site/data; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('_site/data/g0033-temporal-loom.json').read_text())
          assert data["edition"]=="eight-seed-measured-temporal-loom-v1"
          assert data["seeds"]==[42,73,101,137,211,307,401,509]
          assert data["times"]==list(range(0,241,24))
          assert len(data["source_analysis_sha256_by_seed"])==8
          PY
          else
            echo "Temporal Loom measurements not published yet; the browser will show pending evidence."
          fi
      - name: Bundle CI-verified G0034 genealogy evidence when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/data
          if gh release download atlas-media -p g0034-genealogy.json -D _site/data; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('_site/data/g0034-genealogy.json').read_text())
          assert d['generation']=='0034' and d['n']==16 and d['steps']==240
          assert d['seeds']==[42,73] and d['times']==list(range(0,241,24))
          assert len(d['source'])==2
          PY
          elif [ "${{ github.event_name }}" = workflow_run ]; then
            echo 'G0034 workflow completed but genealogy release asset is unavailable.' >&2
            exit 1
          else
            echo 'G0034 numeric release pending; viewer will explicitly show pending state.'
          fi
      - name: Bundle validated G0036 matched numerical trajectories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/data
          gh release download atlas-media -p g0036-summary.json -D _site/data
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('_site/data/g0036-summary.json').read_text())
          assert d['generation']=='0036' and d['seeds']==[42,73]
          assert d['n']==12 and d['steps']==120
          assert d['sample_steps']==list(range(0,121,12))
          assert set(d['observations'])=={'42','73'}
          PY
      - name: Bundle G0036 eight-seed replication after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/data
          if gh release download atlas-media -p g0036-replication.json -D _site/data; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('_site/data/g0036-replication.json').read_text())
          assert d['generation']=='0036' and d['seeds']==[42,73,101,137,211,307,401,509]
          assert d['n']==12 and d['steps']==120
          assert d['sample_steps']==[0,60,120]
          PY
          else
            echo 'G0036 replication not published; viewer shows evidence pending.'
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
