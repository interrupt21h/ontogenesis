name: Publish Ontogenesis interactive GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/visual-atlas.html'
      - 'docs/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate accessible film portal and release-aware display logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          page=Path('site/index.html').read_text()
          atlas=Path('docs/visual-atlas.html').read_text()
          assert '<html lang="en">' in page and '<main class="wrap">' in page
          assert 'id="player"' in page and 'id="cards"' in page
          assert 'id="film-picker"' in page and 'docs/visual-atlas.html' in page
          assert 'api.github.com/repos/interrupt21h/ontogenesis/releases/tags/atlas-media' in page
          assert 'available.get(entry.file)' in page
          assert page.count('gen:"003')>=8
          assert atlas.count('<article class="tile"')==32
          assert 'G0033' in page
          class Parser(HTMLParser):
              pass
          Parser().feed(page)
          Parser().feed(atlas)
          PY
      - name: Parse inline JavaScript with Node before Pages deployment
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inline = []
                  self.in_script = False
              def handle_starttag(self, tag, attrs):
                  self.in_script = tag == "script" and not dict(attrs).get("src")
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.in_script = False
              def handle_data(self, data):
                  if self.in_script:
                      self.inline.append(data)
          parser = ScriptExtractor()
          parser.feed(Path('site/index.html').read_text())
          assert parser.inline, 'No executable site JavaScript was found'
          Path('/tmp/ontogenesis-pages.js').write_text('\n'.join(parser.inline))
          PY
          node --check /tmp/ontogenesis-pages.js
      - name: Assemble project-relative static site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp -a docs _site/docs
          touch _site/.nojekyll
          test -s _site/docs/visual-atlas.html
          test -s _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
