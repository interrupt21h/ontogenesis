name: Generation 0010
on:
  push:
    paths:
      - communication.py
      - requirements.txt
      - .github/workflows/communication.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt scipy==1.15.3
      - run: python communication.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -y -framerate 24 -pattern_type glob -i 'gallery/0010/[0-9]*.png' -vf scale=640:640 -c:v libx264 -pix_fmt yuv420p -crf 25 -movflags +faststart gallery/0010/evolution.mp4
      - uses: actions/upload-artifact@v7
        with:
          name: generation-0010
          path: |
            gallery/0010/metrics.json
            gallery/0010/02400.png
          retention-days: 30
          if-no-files-found: error
      - name: Upload standalone MP4
        id: video
        uses: actions/upload-artifact@v7
        with:
          path: gallery/0010/evolution.mp4
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Link animation
        run: echo '[Download MP4 directly](${{ steps.video.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
