name: G0033 matched-seed native 4D cinematic
on:
  workflow_run:
    workflows: ["G0033 eight-seed native 4D interface robustness pilot"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: g0033-native-film-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cinema:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 matplotlib==3.10.3 pillow==11.2.1 imageio-ffmpeg==0.8.1
      - name: Download native field evidence from successful eight-seed workflow
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p input
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            gh run download "$UPSTREAM_RUN" -R "$GITHUB_REPOSITORY" -n g0033-seed-42-native-evidence -D input
            gh run download "$UPSTREAM_RUN" -R "$GITHUB_REPOSITORY" -n g0033-seed-73-native-evidence -D input
          else
            echo 'Manual rendering requires a successful upstream robustness run. Dispatch that first.' >&2
            exit 1
          fi
      - name: Render real 4D matched-seed field comparison
        run: |
          python -u g0033_native_cinema.py \
            --a input/g0033-seed-42.npz --am input/g0033-seed-42.native.json \
            --b input/g0033-seed-73.npz --bm input/g0033-seed-73.native.json \
            --movie ontogenesis-0033-native-cinematic.mp4 \
            --poster ontogenesis-0033-native-cinematic.png --seconds 24 --fps 24
      - name: Validate both native archives and decoded video
        run: |
          python - <<'PY'
          import hashlib,imageio_ffmpeg,json
          from pathlib import Path
          base=Path("ontogenesis-0033-native-cinematic")
          meta=json.loads(base.with_suffix(".render.json").read_text())
          assert meta['seeds']==[42,73] and not meta['interpolated_numerical_states']
          for seed in (42,73):
              source=Path(f'input/g0033-seed-{seed}.npz')
              info=json.loads(Path(f'input/g0033-seed-{seed}.native.json').read_text())
              sha=hashlib.sha256(source.read_bytes()).hexdigest()
              assert sha==info['archive_sha256']==meta['source_archive_sha256_by_seed'][str(seed)]
          reader=imageio_ffmpeg.read_frames(str(base.with_suffix(".mp4")))
          image=next(reader);reader.close()
          assert tuple(image['size'])==(1280,720)
          count,seconds=imageio_ffmpeg.count_frames_and_secs(str(base.with_suffix(".mp4")))
          assert count==576 and abs(seconds-24)<.1
          assert base.with_suffix(".png").stat().st_size>4096
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: g0033-genuine-native-two-seed-cinematic
          path: |
            ontogenesis-0033-native-cinematic.mp4
            ontogenesis-0033-native-cinematic.png
            ontogenesis-0033-native-cinematic.render.json
          if-no-files-found: error
      - name: Publish verified G0033 cinematic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload atlas-media ontogenesis-0033-native-cinematic.mp4 ontogenesis-0033-native-cinematic.png ontogenesis-0033-native-cinematic.render.json --clobber
