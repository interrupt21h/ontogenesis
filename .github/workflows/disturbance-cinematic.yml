name: G0028 cinematic artificial life
on:
  workflow_dispatch:
    inputs:
      full_resolution:
        description: 'Opt in to expensive 24^4 4800-step artistic capture (one universe)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'consolidation.py'
      - 'disturbance_cinematic.py'
      - 'disturbance_cinematic_render.py'
      - '.github/workflows/disturbance-cinematic.yml'
permissions:
  contents: read
concurrency:
  group: g0028-cinema-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned cinematic runtime and verify host tools
        run: |
          pip install numpy==2.2.6 pillow==11.2.1
          if ! command -v ffmpeg >/dev/null 2>&1 || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version | head -n 1
      - name: Validate code and rendering imports
        run: |
          python -m compileall -q consolidation.py disturbance_cinematic.py disturbance_cinematic_render.py
          python -c 'import disturbance_cinematic,disturbance_cinematic_render; print("Cinematic modules import cleanly")'
      - name: Verify observer independence and archive provenance
        run: python -m unittest discover -s tests -p 'test_disturbance_cinematic.py' -v
      - name: Capture the verified low-budget artistic universe
        run: |
          /usr/bin/time -v python -u disturbance_cinematic.py --n 12 --steps 420 --shock-step 280 --sample-every 10 --out cinematic-preview.npz --metadata cinematic-preview.json
      - name: Render distinct artistic motion from actual native fields
        run: |
          python -u disturbance_cinematic_render.py --input cinematic-preview.npz --metadata cinematic-preview.json --movie ontogenesis-0028-preview.mp4 --poster ontogenesis-0028-preview.png --seconds 18 --fps 24 --width 960 --height 540
      - name: Verify video, archive and unique motion
        run: |
          ffmpeg -v error -xerror -i ontogenesis-0028-preview.mp4 -f null -
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of json ontogenesis-0028-preview.mp4 > probe.json
          python - <<'PY'
          import json
          m=json.load(open('cinematic-preview.json'))
          p=json.load(open('probe.json'))
          assert m['event_step']==280 and m['sample_count']>=40
          assert int(p['streams'][0]['nb_read_frames'])==432
          assert m['recording']['restart_checkpoint'] is False
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: g0028-cinematic-preview
          path: |
            ontogenesis-0028-preview.mp4
            ontogenesis-0028-preview.png
            cinematic-preview.json
            probe.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: g0028-cinematic-preview-fields
          path: cinematic-preview.npz
          if-no-files-found: error
          retention-days: 30
      - name: Archive preview observations and movie for independent rerendering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view atlas-media >/dev/null 2>&1 || gh release create atlas-media --title "Scientific atlas archive" --notes "Verified scientific and artistic numerical source media" --prerelease
          gh release upload atlas-media cinematic-preview.npz cinematic-preview.json ontogenesis-0028-preview.mp4 ontogenesis-0028-preview.png --clobber
          echo "Verified preview media and native fields archived in atlas-media" >> "$GITHUB_STEP_SUMMARY"
  full:
    if: github.event_name == 'workflow_dispatch' && inputs.full_resolution
    needs: preview
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 pillow==11.2.1
      - run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
      - run: python -c 'import numpy as np; np.show_runtime()'
      - run: lscpu
      - name: Archive a single developing high-resolution 4D universe
        run: |
          /usr/bin/time -v python -u disturbance_cinematic.py --n 24 --steps 4800 --shock-step 2600 --sample-every 30 --out cinematic-full.npz --metadata cinematic-full.json
      - name: Render 60-second artistic film from archived observations
        run: |
          python -u disturbance_cinematic_render.py --input cinematic-full.npz --metadata cinematic-full.json --movie ontogenesis-0028-cinematic.mp4 --poster ontogenesis-0028-cinematic.png --seconds 60 --fps 24 --width 1280 --height 720
      - run: ffmpeg -v error -xerror -i ontogenesis-0028-cinematic.mp4 -f null -
      - uses: actions/upload-artifact@v7
        with:
          name: g0028-cinematic-master
          path: |
            ontogenesis-0028-cinematic.mp4
            ontogenesis-0028-cinematic.png
            cinematic-full.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: g0028-cinematic-master-fields
          path: cinematic-full.npz
          if-no-files-found: error
          retention-days: 30
      - name: Publish full-resolution film and numeric fields as durable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view atlas-media >/dev/null 2>&1 || gh release create atlas-media --title "Scientific atlas archive" --notes "Verified scientific and artistic numerical source media" --prerelease
          gh release upload atlas-media cinematic-full.npz cinematic-full.json ontogenesis-0028-cinematic.mp4 ontogenesis-0028-cinematic.png --clobber
          echo "Full 4D-derived cinematic master and native 3D observations archived in atlas-media" >> "$GITHUB_STEP_SUMMARY"
