name: G0033 Temporal Loom eight-seed cinematic
on:
  push:
    branches: [main]
    paths:
      - 'g0033_temporal_loom.py'
      - 'tests/test_g0033_temporal_loom.py'
      - '.github/workflows/g0033-temporal-loom.yml'
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: 'Previously successful eight-seed G0033 numerical workflow run'
        type: string
        default: '45437009050'
permissions:
  contents: read
  actions: read
concurrency:
  group: g0033-temporal-loom-${{ github.ref }}
  cancel-in-progress: true
jobs:
  loom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install only presentation dependencies
        run: python -m pip install pillow==11.2.1 matplotlib==3.10.3 imageio-ffmpeg==0.8.1
      - name: Verify measured-time series handling
        run: |
          python -m compileall -q g0033_temporal_loom.py
          python -m unittest discover -s tests -p test_g0033_temporal_loom.py -v
      - name: Download eight verified independent seed analyses
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.evidence_run_id || '45437009050' }}
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion,name \
            --jq 'if .conclusion=="success" and .name=="G0033 eight-seed native 4D interface robustness pilot" then .name else error("Unverified numerical source run") end'
          mkdir -p evidence
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" \
            -p 'g0033-seed-*-native-evidence' -D evidence
          gh release download atlas-media -p g0033-robustness.json -D evidence
          test "$(find evidence -name 'g0033-seed-*.analysis.json' | wc -l)" -eq 8
      - name: Render 24-second kinetic heatmap of all eight measured histories
        run: |
          set -euo pipefail
          mapfile -t samples < <(find evidence -name 'g0033-seed-*.analysis.json' | sort)
          test "${#samples[@]}" -eq 8
          python -u g0033_temporal_loom.py \
            --inputs "${samples[@]}" \
            --summary evidence/g0033-robustness.json \
            --report g0033-temporal-loom.json \
            --movie ontogenesis-0033-temporal-loom.mp4 \
            --poster ontogenesis-0033-temporal-loom.png \
            --seconds 24 --fps 24
      - name: Verify observed-data agreement and actual video decode
        run: |
          python - <<'PY'
          import json,imageio_ffmpeg
          from pathlib import Path
          evidence=json.loads(Path('g0033-temporal-loom.json').read_text())
          base=Path('ontogenesis-0033-temporal-loom')
          metadata=json.loads(base.with_suffix('.render.json').read_text())
          assert evidence['edition']==metadata['edition']=='eight-seed-measured-temporal-loom-v1'
          assert evidence['times']==list(range(0,241,24))
          assert evidence['seeds']==[42,73,101,137,211,307,401,509]
          assert len(evidence['source_analysis_sha256_by_seed'])==8
          assert metadata['numerical_interpolation'] is False
          movie=base.with_suffix('.mp4')
          frames,seconds=imageio_ffmpeg.count_frames_and_secs(str(movie))
          assert frames==metadata['frames']==576 and abs(seconds-24)<.1
          reader=imageio_ffmpeg.read_frames(str(movie))
          header=next(reader);reader.close()
          assert tuple(header['size'])==(1280,720)
          assert base.with_suffix('.png').stat().st_size>4096
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: g0033-temporal-loom-authentic-eight-seed-cinema
          path: |
            g0033-temporal-loom.json
            ontogenesis-0033-temporal-loom.mp4
            ontogenesis-0033-temporal-loom.png
            ontogenesis-0033-temporal-loom.render.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish distinct temporal visualization edition and web data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload atlas-media \
            g0033-temporal-loom.json \
            ontogenesis-0033-temporal-loom.mp4 \
            ontogenesis-0033-temporal-loom.png \
            ontogenesis-0033-temporal-loom.render.json --clobber
          echo 'Published exact eleven-timepoint, eight-seed G0033 Temporal Loom.' >> "$GITHUB_STEP_SUMMARY"
