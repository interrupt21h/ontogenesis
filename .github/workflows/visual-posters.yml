name: Generate measured and film-derived posters for G0001-G0027
on:
  push:
    branches: [main]
    paths:
      - visual_posters.py
      - tests/test_visual_posters.py
      - .github/workflows/visual-posters.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-posters-${{ github.ref }}
  cancel-in-progress: true
jobs:
  posters:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned portable video decoder and graphics
        run: |
          python -m pip install pillow==11.2.1 matplotlib==3.10.3 imageio-ffmpeg==0.8.1
          python -m unittest discover -s tests -p test_visual_posters.py -v
      - name: Decode midpoint frames from G0001-G0026 and graph archived G0027 measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u visual_posters.py --videos report/videos.json --out visual-posters
      - name: Verify source provenance and all 27 actual posters
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          folder=Path('visual-posters')
          d=json.loads((folder/'ontogenesis-visual-poster-manifest.json').read_text())
          assert set(d['films'])=={f"{i:04d}" for i in range(1,28)}
          for gen,x in d['films'].items():
              png=folder/f'ontogenesis-atlas-{gen}.png'
              assert png.stat().st_size>4096
              assert png.read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10])
              assert hashlib.sha256(png.read_bytes()).hexdigest()==x['poster_sha256']
          assert d['films']['0027']['type'].startswith('actual structural')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: G0001-G0027-actual-visual-posters
          path: |
            visual-posters/*.png
            visual-posters/ontogenesis-visual-poster-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified posters and source manifest as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload atlas-media visual-posters/*.png \
            visual-posters/ontogenesis-visual-poster-manifest.json --clobber
