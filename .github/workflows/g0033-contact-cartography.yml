name: G0033 Contact Cartography cinematic
on:
  push:
    branches: [main]
    paths:
      - 'g0033_contact_cartography.py'
      - 'tests/test_g0033_contact_cartography.py'
      - '.github/workflows/g0033-contact-cartography.yml'
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: 'Successful G0033 eight-seed numerical workflow run ID'
        type: string
        default: '45437009050'
permissions:
  contents: read
  actions: read
concurrency:
  group: g0033-contact-cartography-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contact-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded rendering dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 matplotlib==3.10.3 pillow==11.2.1 imageio-ffmpeg==0.8.1
      - name: Test native four-axis contact geometry and display independence
        run: |
          python -m compileall -q g0033_contact_cartography.py
          python -m unittest discover -s tests -p test_g0033_contact_cartography.py -v
      - name: Download known successful G0033 field archives and measured summary
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.evidence_run_id || '45437009050' }}
        run: |
          mkdir -p input
          gh run view "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion,name \
            --jq 'if .conclusion == "success" and .name == "G0033 eight-seed native 4D interface robustness pilot" then .conclusion else error("Not an accepted successful G0033 run") end'
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n g0033-seed-42-native-evidence -D input
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n g0033-seed-73-native-evidence -D input
          gh release download atlas-media -p g0033-robustness.json -D input
      - name: Verify native SHA-256 against independently published numerical results
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          report=json.loads(Path("input/g0033-robustness.json").read_text())
          assert report["generation"]=="0033" and report["seeds"]==[42,73,101,137,211,307,401,509]
          for seed in (42,73):
              root=Path(f"input/g0033-seed-{seed}")
              native=json.loads(root.with_suffix(".native.json").read_text())
              sha=hashlib.sha256(root.with_suffix(".npz").read_bytes()).hexdigest()
              assert sha==native["archive_sha256"]==report["source_archive_sha256_by_seed"][str(seed)]
              assert native["n"]==16 and native["steps"]==240
          PY
      - name: Smoke encode original recorded contact geometry
        run: |
          python -u g0033_contact_cartography.py \
            --a input/g0033-seed-42.npz --am input/g0033-seed-42.native.json \
            --b input/g0033-seed-73.npz --bm input/g0033-seed-73.native.json \
            --movie /tmp/g0033-contact-smoke.mp4 --poster /tmp/g0033-contact-smoke.png \
            --seconds 2 --fps 8
      - name: Render distinct 24-second contact-cartography cinematic
        run: |
          /usr/bin/time -v python -u g0033_contact_cartography.py \
            --a input/g0033-seed-42.npz --am input/g0033-seed-42.native.json \
            --b input/g0033-seed-73.npz --bm input/g0033-seed-73.native.json \
            --movie ontogenesis-0033-contact-cartography.mp4 \
            --poster ontogenesis-0033-contact-cartography.png \
            --seconds 24 --fps 24
      - name: Validate decoded frames, full source provenance and distinct edition
        run: |
          python - <<'PY'
          import hashlib,json,imageio_ffmpeg
          from pathlib import Path
          base=Path("ontogenesis-0033-contact-cartography")
          meta=json.loads(base.with_suffix(".render.json").read_text())
          assert meta["edition"]=="native-four-axis-contact-cartography-v1"
          assert meta["seeds"]==[42,73] and meta["all_omega_hyperplanes"]==list(range(16))
          assert meta["numerical_interpolation"] is False
          for seed in (42,73):
              src=Path(f"input/g0033-seed-{seed}.npz")
              assert meta["sources_sha256"][str(seed)]==hashlib.sha256(src.read_bytes()).hexdigest()
          movie=base.with_suffix(".mp4")
          count,duration=imageio_ffmpeg.count_frames_and_secs(str(movie))
          assert count==meta["frames"]==576 and abs(duration-24)<.1
          reader=imageio_ffmpeg.read_frames(str(movie))
          header=next(reader);reader.close()
          assert tuple(header["size"])==(1280,720)
          assert base.with_suffix(".png").stat().st_size>4096
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: g0033-authentic-four-axis-contact-cartography-cinematic
          path: |
            ontogenesis-0033-contact-cartography.mp4
            ontogenesis-0033-contact-cartography.png
            ontogenesis-0033-contact-cartography.render.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish separate audited visual edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload atlas-media \
            ontogenesis-0033-contact-cartography.mp4 \
            ontogenesis-0033-contact-cartography.png \
            ontogenesis-0033-contact-cartography.render.json --clobber
          echo "Published G0033 native 4D contact cartography from checked source archives." >> "$GITHUB_STEP_SUMMARY"
