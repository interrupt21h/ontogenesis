name: Scientific report
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'report/**'
      - 'docs/**'
      - '.github/workflows/report.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: scientific-report
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install LaTeX and Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils ffmpeg librsvg2-bin
      - uses: actions/cache@v4
        with:
          path: report/build/frames
          key: report-frames-v2-${{ hashFiles('report/videos.json') }}
          restore-keys: report-frames-v2-
      - name: Extract verified animation frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 report/frames.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 matplotlib==3.10.3 pymupdf==1.26.0 pyyaml==6.0.2
      - name: Retrieve archived numerical observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view atlas-media --json assets > /tmp/atlas-assets.json
          for gen in 0024 0025; do
            if python -c 'import json,sys; sys.exit(not any(a["name"]=="field-state-"+sys.argv[1]+".tar.gz" for a in json.load(open("/tmp/atlas-assets.json"))["assets"]))' "$gen"; then
              mkdir -p "report/build/numerical/$gen"
              gh release download atlas-media -p "field-state-$gen.tar.gz" -D /tmp
              tar -xzf "/tmp/field-state-$gen.tar.gz" -C "report/build/numerical/$gen"
              python report/field_atlas.py "report/build/numerical/$gen/fields" report/build/atlas
            fi
          done
      - name: Retrieve consolidation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in 0026:14651386328 0027:14670723105; do
            gen=${pair%:*}
            id=${pair#*:}
            mkdir -p "report/build/evidence/$gen"
            if gh release download atlas-media -p "structural-evidence-$gen.json" -D "report/build/evidence/$gen"; then
              mv "report/build/evidence/$gen/structural-evidence-$gen.json" "report/build/evidence/$gen/result.json"
            else
              gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "/tmp/evidence-$gen.zip"
              unzip -o "/tmp/evidence-$gen.zip" -d "report/build/evidence/$gen"
            fi
            test -s "report/build/evidence/$gen/result.json"
          done
          python report/consolidation_atlas.py
      - name: Retrieve verified G0028 pilot evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p report/build/evidence/0028
          if gh release download atlas-media -p "disturbance-evidence-0028.json" -D report/build/evidence/0028; then
            mv report/build/evidence/0028/disturbance-evidence-0028.json report/build/evidence/0028/result.json
          else
            gh api "repos/interrupt21h/ontogenesis/actions/artifacts/14670709650/zip" > /tmp/g0028-pilot.zip
            unzip -o /tmp/g0028-pilot.zip -d report/build/evidence/0028
          fi
          test -s report/build/evidence/0028/result.json
          python report/disturbance_atlas.py report/build/evidence/0028/result.json report/build/atlas/0028-evidence.pdf
          test -s report/build/atlas/0028-evidence.pdf
      - name: Validate report generator syntax
        run: python3 -m compileall -q report
      - name: Collect engineering atlas
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 report/engineering_metrics.py
      - run: python3 report/build.py
      - name: Verify PDF
        run: |
          pdfinfo report/build/ontogenesis.pdf
          pdftotext report/build/ontogenesis.pdf report/build/verified.txt
          test -s report/build/atlas/0024-field-evolution.pdf
          grep -q 'Evolution of the computational production framework' report/build/verified.txt
          for plate in repository-growth execution-timeline artifact-production workflow-topology; do test -s "report/build/engineering/$plate.pdf"; done
          test -s report/build/atlas/0026-evidence.pdf
          test -s report/build/atlas/0027-evidence.pdf
          test -s report/build/atlas/0028-evidence.pdf
          grep -q 'Generation 0028' report/build/verified.txt
          grep -q 'Final renders and visualization fidelity' report/build/verified.txt
          grep -q 'The late-experiment branch structure' report/build/verified.txt
          test -s report/build/atlas/research-finale.pdf
          python - <<'PY'
          import fitz, re
          d=fitz.open("report/build/ontogenesis.pdf")
          assert len(d)>=191, f"Final-render gallery missing: {len(d)} pages"
          content="\n".join(p.get_text() for p in d)
          for n in ("0024","0025","0028"):
              assert re.search(r"FINAL RENDERS\s*/\s*GENERATION\s*"+n, content), f"Missing verified gallery plate G{n}"
          assert "About the artist" in d[-1].get_text() or "About the artist" in d[-2].get_text()
          PY
          grep -q 'About the artist' report/build/verified.txt
          grep -q 'Generation 0024' report/build/verified.txt
          grep -q 'Generation 0001' report/build/verified.txt
          grep -q 'The genealogy of the investigation' report/build/verified.txt
          grep -q 'Comparative experimental evidence' report/build/verified.txt
          for plate in spatial-sections genetic-architecture research-genealogy comparative-endpoints threshold-profile; do test -s "report/build/atlas/$plate.pdf"; done
      - name: Audit page composition
        run: python3 report/audit.py
      - name: Upload standalone PDF
        id: pdf
        uses: actions/upload-artifact@v7
        with:
          path: report/build/ontogenesis.pdf
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload generated LaTeX sources
        uses: actions/upload-artifact@v7
        with:
          name: report-source
          path: |
            report/build/ontogenesis.tex
            report/build/report.md
            report/preamble.tex
            report/build/frames
            report/build/mechanisms
            report/build/atlas
            report/build/cover.png
            report/build/phase_art
            report/build/evidence
            report/build/layout-audit.json
            report/build/experiment-figure-audit.json
            report/build/contact-sheet.jpg
            report/build/engineering
      - name: Archive verified report and native frame samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view atlas-media >/dev/null 2>&1 || gh release create atlas-media --title "Scientific atlas archive" --notes "Verified report and provenance-labelled frame samples." --prerelease
          python3 report/archive.py
          for gen in 0026 0027; do
            cp "report/build/evidence/$gen/result.json" "report/build/evidence/$gen/structural-evidence-$gen.json"
            gh release upload atlas-media "report/build/evidence/$gen/structural-evidence-$gen.json" --clobber
          done
          cp report/build/evidence/0028/result.json report/build/evidence/0028/disturbance-evidence-0028.json
          gh release upload atlas-media report/build/evidence/0028/disturbance-evidence-0028.json --clobber
          gh release upload atlas-media report/build/ontogenesis.pdf --clobber
      - name: Link report
        run: echo '[Download standalone PDF](${{ steps.pdf.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve compilation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: report-build-debug
          path: |
            report/build/ontogenesis.log
            report/build/ontogenesis.tex
            report/build/report.md
