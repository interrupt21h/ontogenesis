name: Illustrated field journal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'report/**'
      - 'docs/**'
      - '.github/workflows/report.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: illustrated-field-journal
  cancel-in-progress: true
jobs:
  report:
    # Pin the LTS image: ubuntu-latest moved to 26.04 and the new mirror timed out while downloading TeX.
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install LaTeX and Pandoc (minimal dependencies, retry transient mirror failures)
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's Ubuntu 24.04 runner uses an EC2 mirror such as
          # us-east-2.ec2.archive.ubuntu.com, NOT only azure.archive.ubuntu.com.
          # The preceding build stalled on that EC2 mirror for 18 minutes.
          # Normalize both deb822 .sources and legacy .list entries, while
          # preserving signed-by and release component definitions.
          sudo python3 - <<'PY'
          import pathlib,re
          for path in [pathlib.Path("/etc/apt/sources.list"),
                       *pathlib.Path("/etc/apt/sources.list.d").glob("*.sources"),
                       *pathlib.Path("/etc/apt/sources.list.d").glob("*.list")]:
              if not path.is_file():
                  continue
              content=path.read_text()
              fixed=re.sub(
                  r"https?://(?:[a-z0-9-]+\.)*(?:ec2\.archive|azure\.archive|archive)\.ubuntu\.com/ubuntu/?",
                  "http://archive.ubuntu.com/ubuntu/",
                  content,flags=re.I)
              if fixed!=content:
                  print("Normalizing slow Ubuntu package mirror:",path)
                  path.write_text(fixed)
          PY
          grep -rhE '^(URIs:|deb http)' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true
          sudo timeout 360 apt-get -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 1500 apt-get \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
            pandoc latexmk texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended lmodern poppler-utils ffmpeg librsvg2-bin
          for program in pandoc latexmk pdflatex pdfinfo pdftotext ffmpeg rsvg-convert; do
            command -v "$program"
          done
      - uses: actions/cache@v4
        with:
          path: report/build/frames
          key: report-frames-v2-${{ hashFiles('report/videos.json') }}
          restore-keys: report-frames-v2-
      - name: Extract verified animation frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 report/frames.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 matplotlib==3.10.3 pymupdf==1.26.0 pyyaml==6.0.2
      - name: Retrieve archived numerical observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view atlas-media --json assets > /tmp/atlas-assets.json
          for gen in 0024 0025; do
            if python -c 'import json,sys; sys.exit(not any(a["name"]=="field-state-"+sys.argv[1]+".tar.gz" for a in json.load(open("/tmp/atlas-assets.json"))["assets"]))' "$gen"; then
              mkdir -p "report/build/numerical/$gen"
              gh release download atlas-media -p "field-state-$gen.tar.gz" -D /tmp
              tar -xzf "/tmp/field-state-$gen.tar.gz" -C "report/build/numerical/$gen"
              python report/field_atlas.py "report/build/numerical/$gen/fields" report/build/atlas
            fi
          done
      - name: Retrieve consolidation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in 0026:14651386328 0027:14670723105; do
            gen=${pair%:*}
            id=${pair#*:}
            mkdir -p "report/build/evidence/$gen"
            if gh release download atlas-media -p "structural-evidence-$gen.json" -D "report/build/evidence/$gen"; then
              mv "report/build/evidence/$gen/structural-evidence-$gen.json" "report/build/evidence/$gen/result.json"
            else
              gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "/tmp/evidence-$gen.zip"
              unzip -o "/tmp/evidence-$gen.zip" -d "report/build/evidence/$gen"
            fi
            test -s "report/build/evidence/$gen/result.json"
          done
          python report/consolidation_atlas.py
      - name: Retrieve verified G0028 pilot evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p report/build/evidence/0028
          if gh release download atlas-media -p "disturbance-evidence-0028.json" -D report/build/evidence/0028; then
            mv report/build/evidence/0028/disturbance-evidence-0028.json report/build/evidence/0028/result.json
          else
            gh api "repos/interrupt21h/ontogenesis/actions/artifacts/14670709650/zip" > /tmp/g0028-pilot.zip
            unzip -o /tmp/g0028-pilot.zip -d report/build/evidence/0028
          fi
          test -s report/build/evidence/0028/result.json
          python report/disturbance_atlas.py report/build/evidence/0028/result.json report/build/atlas/0028-evidence.pdf
          test -s report/build/atlas/0028-evidence.pdf
      - name: Retrieve verified G0028 full-domain paired evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p report/build/evidence/0028-full
          if gh release download atlas-media -p "disturbance-evidence-0028-full.json" -D report/build/evidence/0028-full; then
            mv report/build/evidence/0028-full/disturbance-evidence-0028-full.json report/build/evidence/0028-full/result.json
          else
            gh api "repos/interrupt21h/ontogenesis/actions/artifacts/14682932255/zip" > /tmp/g0028-full.zip
            unzip -o /tmp/g0028-full.zip result.json -d report/build/evidence/0028-full
          fi
          test -s report/build/evidence/0028-full/result.json
          python - <<'PY'
          import json
          x=json.load(open("report/build/evidence/0028-full/result.json"))
          assert (x["generation"],x["seed"],x["n"],x["steps"],x["event_step"])==("0028",42,24,4800,2400)
          assert len(x["arms"]["control"]["frames"])==len(x["arms"]["shock"]["frames"])>=121
          assert len(x["arms"]["control"]["hashes"])==len(x["arms"]["shock"]["hashes"])==41
          e=x["comparisons"]["local_energy"];m=x["comparisons"]["local_matrix"]
          assert e["event_difference"]<0 and m["event_difference"]<0
          assert e["end_difference"]<0 and m["end_difference"]>0
          PY
          python report/disturbance_atlas.py report/build/evidence/0028-full/result.json report/build/atlas/0028-full-evidence.pdf
          test -s report/build/atlas/0028-full-evidence.pdf
      - name: Retrieve G0030 verified numerical observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p report/build/evidence/0030 report/build/atlas
          gh release download atlas-media -p 'g0030-pilot.json' -p 'g0030-pilot.png' -D report/build/evidence/0030
          python - <<'PY'
          import json, math
          from pathlib import Path
          base=Path('report/build/evidence/0030')
          data=json.loads((base/'g0030-pilot.json').read_text())
          assert (data['generation'],data['n'],data['steps'],data['seeds'])==('0030',16,1200,[42,73])
          assert isinstance(data['source_sha'],str) and len(data['source_sha'])==40
          arms={'neither','w_to_v_only','v_to_w_only','both'}
          for seed in ('42','73'):
              assert set(data['observations'][seed])==arms
              assert len({x['0'] for x in data['state_hashes'][seed].values()})==1
              for rows in data['observations'][seed].values():
                  assert [r['step'] for r in rows]==data['times']
                  assert all(math.isfinite(r['energy_mean']) for r in rows)
          png=base/'g0030-pilot.png'
          assert png.stat().st_size>4096
          assert png.read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10])
          PY
          cp report/build/evidence/0030/g0030-pilot.png report/build/atlas/0030-pilot.png
      - name: Retrieve and verify G0031 viability frontier evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p report/build/evidence/0031 report/build/atlas
          gh release download atlas-media -p 'g0031-pilot.json' -p 'g0031-pilot.png' -D report/build/evidence/0031
          python - <<'PY'
          import json,math
          from pathlib import Path
          folder=Path('report/build/evidence/0031')
          d=json.loads((folder/'g0031-pilot.json').read_text())
          assert (d['generation'],d['n'],d['steps'],d['seeds'])==('0031',16,240,[42,73])
          assert isinstance(d['source_sha'],str) and len(d['source_sha'])==40
          assert d['arms']=={'historical':1.0,'v_loss_095':.95,'v_loss_090':.90,'v_loss_085':.85,'v_loss_080':.80}
          assert not d['any_endpoint_both_active']
          for seed in ('42','73'):
              assert len({x['0'] for x in d['hashes'][seed].values()})==1
              assert len(d['observations'][seed])==5
              for rows in d['observations'][seed].values():
                  assert [r['step'] for r in rows]==d['times']
                  assert all(math.isfinite(r['v_active']) and math.isfinite(r['w_active']) for r in rows)
          png=folder/'g0031-pilot.png'
          assert png.stat().st_size>4096 and png.read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10])
          PY
          cp report/build/evidence/0031/g0031-pilot.png report/build/atlas/0031-pilot.png
      - name: Retrieve and validate G0032 niche measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p report/build/evidence/0032 report/build/atlas
          gh release download atlas-media -p 'g0032-pilot.json' -p 'g0032-pilot.png' -D report/build/evidence/0032
          python - <<'PY'
          import json,math
          from pathlib import Path
          folder=Path("report/build/evidence/0032")
          d=json.loads((folder/"g0032-pilot.json").read_text())
          assert (d["generation"],d["n"],d["steps"],d["seeds"])==("0032",16,240,[42,73])
          assert isinstance(d["source_sha"],str) and len(d["source_sha"])==40
          assert set(d["arms"])=={"historical","near_transition","separated_035","separated_070"}
          assert d["any_endpoint_cooccupancy"] is False
          for seed in ("42","73"):
              assert len({v["0"] for v in d["hashes"][seed].values()})==1
              for rows in d["observations"][seed].values():
                  assert [r["step"] for r in rows]==d["times"]
                  assert all(math.isfinite(r["v_active"]) and math.isfinite(r["w_active"]) and
                             math.isfinite(r["habitat_separation"]) for r in rows)
          for arm in ("separated_035","separated_070"):
              assert d["endpoints"]["73"][arm]["v_active"]>0
              assert d["endpoints"]["73"][arm]["w_active"]>0
              assert d["endpoints"]["73"][arm]["coexistence"]==0
          p=folder/"g0032-pilot.png"
          assert p.stat().st_size>4096 and p.read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10])
          PY
          cp report/build/evidence/0032/g0032-pilot.png report/build/atlas/0032-pilot.png
      - name: Authenticate numerical source revisions against successful experiment workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          # Query historical runs by the *exact* recorded source commit.
          # Reading only the newest 100 Actions runs drops original pilot runs
          # as subsequent cinematic/documentation CI grows the repository.
          sources={
              '0030':('G0030 ecological succession controls','g0030-pilot.json'),
              '0031':('G0031 population viability frontier','g0031-pilot.json'),
              '0032':('G0032 complementary spatial niche screen','g0032-pilot.json'),
          }
          matched={}
          for generation,(workflow,filename) in sources.items():
              d=json.loads((Path('report/build/evidence')/generation/filename).read_text())
              sha=d['source_sha']
              runs=json.loads(subprocess.check_output(
                  ['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?head_sha={sha}&per_page=100"],
                  text=True))['workflow_runs']
              hits=[r for r in runs if r.get('head_sha')==sha
                    and r.get('name')==workflow and r.get('conclusion')=='success']
              assert hits,f"No completed, successful CI source for G{generation}: {d['source_sha']}"
              matched[generation]={'source_sha':d['source_sha'],'workflow_run_id':hits[0]['id']}
              print(f"G{generation} verified against successful Actions run {hits[0]['id']}")
          Path('report/build/evidence/verified-source-runs.json').write_text(
              json.dumps(matched,indent=2)+'\\n')
          PY
      - name: Verify published G0032 genuine spatial field poster and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p report/build/evidence/0032-spatial report/build/atlas
          gh release download atlas-media \
            -p 'ontogenesis-0032-spatial.png' \
            -p 'ontogenesis-0032-spatial.render.json' \
            -p 'g0032-native-fields-seed73.json' \
            -D report/build/evidence/0032-spatial
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          folder=Path('report/build/evidence/0032-spatial')
          film=json.loads((folder/'ontogenesis-0032-spatial.render.json').read_text())
          state=json.loads((folder/'g0032-native-fields-seed73.json').read_text())
          assert film['generation']=='0032' and state['generation']=='0032'
          assert film['source_archive_sha256']==state['archive_sha256']
          assert film['source_numeric_revision']==state['source_sha']
          assert state['seed']==73 and state['n']==16 and state['steps']==480
          assert len(state['sample_steps'])==21
          assert film['fixed_omega_slice']==8 and not film['interpolated_numerical_states']
          assert film['frames']==576 and film['featured_G0028_preserved']
          assert all(state['same_seed_initial_state_matches'].values())
          runs=json.loads(subprocess.check_output(
              ['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?head_sha={film['render_commit']}&per_page=100"],
              text=True))['workflow_runs']
          assert any(r.get('head_sha')==film['render_commit'] and
                     r.get('conclusion')=='success' and
                     r.get('name')=='G0032 genuine 4D spatial cinematic' for r in runs)
          png=folder/'ontogenesis-0032-spatial.png'
          assert png.stat().st_size>4096 and png.read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10])
          PY
          cp report/build/evidence/0032-spatial/ontogenesis-0032-spatial.png report/build/atlas/0032-spatial.png
      - name: Validate native G0032 four-dimensional contacts and embed the real plot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p report/build/evidence/0032-interface report/build/atlas
          gh release download atlas-media \
            -p 'g0032-spatial-interface.json' \
            -p 'g0032-spatial-interface.png' \
            -D report/build/evidence/0032-interface
          python - <<'PY'
          import json
          from pathlib import Path
          analysis=Path('report/build/evidence/0032-interface')
          states=Path('report/build/evidence/0032-spatial/g0032-native-fields-seed73.json')
          info=json.loads(states.read_text())
          d=json.loads((analysis/'g0032-spatial-interface.json').read_text())
          assert (d['generation'],d['n'],d['seed'])==('0032',16,73)
          assert d['source_archive_sha256']==info['archive_sha256']
          assert d['times']==info['sample_steps']
          niche=d['endpoints']['separated_070']
          baseline=d['endpoints']['near_transition']
          assert niche['four_dimensional_face_contacts']==2806
          assert niche['both_active_cells']==2
          assert niche['v_active_cells']==42113 and niche['w_active_cells']==14966
          assert baseline['v_active_cells']==0 and baseline['four_dimensional_face_contacts']==0
          png=analysis/'g0032-spatial-interface.png'
          assert png.stat().st_size>4096 and png.read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10])
          PY
          cp report/build/evidence/0032-interface/g0032-spatial-interface.png report/build/atlas/0032-interface.png
      - name: Validate report generator syntax
        run: python3 -m compileall -q report
      - name: Collect engineering atlas
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 report/engineering_metrics.py
      - run: python3 report/build.py
      - name: Verify PDF
        run: |
          pdfinfo report/build/ontogenesis.pdf
          pdftotext report/build/ontogenesis.pdf report/build/verified.txt
          test -s report/build/atlas/0024-field-evolution.pdf
          grep -q 'Keeping the machinery running' report/build/verified.txt
          for plate in repository-growth execution-timeline artifact-production workflow-topology; do test -s "report/build/engineering/$plate.pdf"; done
          test -s report/build/atlas/0026-evidence.pdf
          test -s report/build/atlas/0027-evidence.pdf
          test -s report/build/atlas/0028-evidence.pdf
          test -s report/build/atlas/0028-full-evidence.pdf
          test -s report/build/atlas/0030-pilot.png
          test -s report/build/atlas/0031-pilot.png
          test -s report/build/atlas/0032-pilot.png
          test -s report/build/atlas/0032-spatial.png
          test -s report/build/atlas/0032-interface.png
          grep -q 'Generation 0030' report/build/verified.txt
          grep -q 'Generation 0032' report/build/verified.txt
          grep -q 'Generation 0031' report/build/verified.txt
          grep -q 'Generation 0028' report/build/verified.txt
          grep -q 'The moving pictures' report/build/verified.txt
          grep -q 'The late-experiment branch structure' report/build/verified.txt
          test -s report/build/atlas/research-finale.pdf
          python - <<'PY'
          import fitz, re
          d=fitz.open("report/build/ontogenesis.pdf")
          assert len(d)>=165, f"Unexpectedly incomplete monograph: {len(d)} pages"
          content="\n".join(p.get_text() for p in d)
          for n in ("0024","0025","0028"):
              assert re.search(r"FINAL RENDERS\s*/\s*GENERATION\s*"+n, content), f"Missing verified gallery plate G{n}"
          assert "About the artist" in d[-1].get_text() or "About the artist" in d[-2].get_text()
          PY
          grep -q 'About the artist' report/build/verified.txt
          grep -q 'Generation 0024' report/build/verified.txt
          grep -q 'Generation 0001' report/build/verified.txt
          grep -q 'The genealogy of the investigation' report/build/verified.txt
          grep -q 'Comparative experimental evidence' report/build/verified.txt
          for plate in spatial-sections genetic-architecture research-genealogy comparative-endpoints threshold-profile; do test -s "report/build/atlas/$plate.pdf"; done
      - name: Audit page composition
        run: python3 report/audit.py
      - name: Upload standalone PDF
        id: pdf
        uses: actions/upload-artifact@v7
        with:
          path: report/build/ontogenesis.pdf
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload generated LaTeX sources
        uses: actions/upload-artifact@v7
        with:
          name: report-source
          path: |
            report/build/ontogenesis.tex
            report/build/report.md
            report/preamble.tex
            report/build/frames
            report/build/mechanisms
            report/build/atlas
            report/build/cover.png
            report/build/phase_art
            report/build/evidence
            report/build/layout-audit.json
            report/build/experiment-figure-audit.json
            report/build/contact-sheet.jpg
            report/build/engineering
      - name: Archive verified report and native frame samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view atlas-media >/dev/null 2>&1 || gh release create atlas-media --title "Ontogenesis media and field journal archive" --notes "Verified report and provenance-labelled frame samples." --prerelease
          python3 report/archive.py
          for gen in 0026 0027; do
            cp "report/build/evidence/$gen/result.json" "report/build/evidence/$gen/structural-evidence-$gen.json"
            gh release upload atlas-media "report/build/evidence/$gen/structural-evidence-$gen.json" --clobber
          done
          cp report/build/evidence/0028/result.json report/build/evidence/0028/disturbance-evidence-0028.json
          gh release upload atlas-media report/build/evidence/0028/disturbance-evidence-0028.json --clobber
          cp report/build/evidence/0028-full/result.json report/build/evidence/0028-full/disturbance-evidence-0028-full.json
          gh release upload atlas-media report/build/evidence/0028-full/disturbance-evidence-0028-full.json --clobber
          gh release upload atlas-media report/build/ontogenesis.pdf --clobber
      - name: Link report
        run: echo '[Download standalone PDF](${{ steps.pdf.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve compilation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: report-build-debug
          path: |
            report/build/ontogenesis.log
            report/build/ontogenesis.tex
            report/build/report.md
