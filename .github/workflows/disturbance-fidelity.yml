name: G0028 volumetric fidelity edition
on:
  workflow_dispatch:
    inputs:
      full_resolution:
        description: 'Opt in to G0025-cadence 24^4 simulation, 4 omega planes and 96^3 ray rendering'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'consolidation.py'
      - 'disturbance_cinematic_fidelity.py'
      - 'disturbance_fidelity_render.py'
      - 'tests/test_disturbance_fidelity.py'
      - '.github/workflows/disturbance-fidelity.yml'
permissions:
  contents: read
concurrency:
  group: g0028-fidelity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned numerical and cinematic libraries
        run: |
          pip install numpy==2.2.6 scipy==1.15.3 pillow==11.2.1
          if ! command -v ffmpeg >/dev/null 2>&1 || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          python -m compileall -q consolidation.py disturbance_cinematic_fidelity.py disturbance_fidelity_render.py
      - name: Verify model observer invariance, dense source and volume renderer
        run: python -m unittest discover -s tests -p 'test_disturbance_fidelity.py' -v
      - name: Archive four observed 3D omega hyperplanes on the cheap
        run: |
          /usr/bin/time -v python -u disturbance_cinematic_fidelity.py --n 12 --steps 160 --shock-step 75 --sample-every 4 --omega-planes 4 --out cinematic-fidelity-preview.npz --metadata cinematic-fidelity-preview.json
      - name: Produce 12-second emission-absorption art preview
        run: |
          /usr/bin/time -v python -u disturbance_fidelity_render.py --input cinematic-fidelity-preview.npz --metadata cinematic-fidelity-preview.json --movie ontogenesis-0028-fidelity-preview.mp4 --poster ontogenesis-0028-fidelity-preview.png --seconds 12 --fps 24 --width 960 --height 540 --ray-samples 56
      - name: Decode and validate 288 cinematic frames
        run: |
          ffmpeg -v error -xerror -i ontogenesis-0028-fidelity-preview.mp4 -f null -
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of json ontogenesis-0028-fidelity-preview.mp4 > cinematic-probe.json
          python - <<'PY'
          import json
          m=json.load(open("cinematic-fidelity-preview.json"))
          p=json.load(open("cinematic-probe.json"))
          r=json.load(open("ontogenesis-0028-fidelity-preview.render.json"))
          assert m["recording"]["omega_indices"]==[0,3,6,9]
          assert m["recording"]["dense_dtype"]=="float32"
          assert m["sample_every"]==4 and m["sample_count"]>=42
          assert m["recording"]["density_planes_per_sample"]==4
          assert int(p["streams"][0]["nb_read_frames"])==288
          assert r["video_frames"]==288 and r["ray_samples_per_axis"]==56
          assert r["frame_motion_samples"]>=7
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: g0028-fidelity-preview-video
          path: |
            ontogenesis-0028-fidelity-preview.mp4
            ontogenesis-0028-fidelity-preview.png
            ontogenesis-0028-fidelity-preview.render.json
            cinematic-fidelity-preview.json
            cinematic-probe.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: g0028-fidelity-preview-numeric
          path: cinematic-fidelity-preview.npz
          retention-days: 30
          if-no-files-found: error
      - name: Retain verified source archive and film independently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view atlas-media >/dev/null 2>&1 || gh release create atlas-media --title 'Scientific atlas archive' --notes 'Verified numerical fields and films' --prerelease
          gh release upload atlas-media cinematic-fidelity-preview.npz cinematic-fidelity-preview.json ontogenesis-0028-fidelity-preview.mp4 ontogenesis-0028-fidelity-preview.png ontogenesis-0028-fidelity-preview.render.json --clobber
  full:
    if: (github.event_name == 'workflow_dispatch' && inputs.full_resolution) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[G0028-HIFI]'))
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6 scipy==1.15.3 pillow==11.2.1
      - run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
      - run: python -c 'import numpy as np; np.show_runtime()'
      - run: lscpu
      - name: Archive four genuine 3D hyperplanes every four 4D steps
        run: |
          /usr/bin/time -v python -u disturbance_cinematic_fidelity.py --n 24 --steps 4800 --shock-step 2600 --sample-every 4 --omega-planes 4 --max-raw-mib 1536 --out cinematic-fidelity-full.npz --metadata cinematic-fidelity-full.json
      - name: Render 60-second 96-cubed volumetric master
        run: |
          /usr/bin/time -v python -u disturbance_fidelity_render.py --input cinematic-fidelity-full.npz --metadata cinematic-fidelity-full.json --movie ontogenesis-0028-fidelity-master.mp4 --poster ontogenesis-0028-fidelity-master.png --seconds 60 --fps 24 --width 1280 --height 720 --ray-samples 96
      - run: ffmpeg -v error -xerror -i ontogenesis-0028-fidelity-master.mp4 -f null -
      - uses: actions/upload-artifact@v7
        with:
          name: g0028-fidelity-master-film
          path: |
            ontogenesis-0028-fidelity-master.mp4
            ontogenesis-0028-fidelity-master.png
            ontogenesis-0028-fidelity-master.render.json
            cinematic-fidelity-full.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: g0028-fidelity-master-numeric
          path: cinematic-fidelity-full.npz
          if-no-files-found: error
          retention-days: 30
      - name: Publish full-precision numerical keyframes and actual art film
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view atlas-media >/dev/null 2>&1 || gh release create atlas-media --title 'Scientific atlas archive' --notes 'Verified numerical observations and films' --prerelease
          gh release upload atlas-media cinematic-fidelity-full.npz cinematic-fidelity-full.json ontogenesis-0028-fidelity-master.mp4 ontogenesis-0028-fidelity-master.png ontogenesis-0028-fidelity-master.render.json --clobber
          echo 'Numerical fields and 96-cubed cinematic master preserved separately' >> "$GITHUB_STEP_SUMMARY"
