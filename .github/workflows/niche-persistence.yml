name: G0032 longer-horizon spatial niche persistence
on:
  push:
    branches: [main]
    paths:
      - 'niche_persistence.py'
      - 'tests/test_niche_persistence.py'
      - '.github/workflows/niche-persistence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g0032-persistence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned numerical renderer and test prerequisites
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 matplotlib==3.10.3 pillow==11.2.1
      - name: Test initial-state integrity and transparent checkpoint-difference reporting
        run: |
          python -m compileall -q niche_persistence.py
          python -m unittest discover -s tests -p test_niche_persistence.py -v
      - name: Download G0032 original archive as independent seeded comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh release download atlas-media -p 'g0032-pilot.json' -D input
          test -s input/g0032-pilot.json
      - name: Rerun matched seeds independently to step 480
        run: |
          /usr/bin/time -v python -u niche_persistence.py \
            --source input/g0032-pilot.json --steps 480 --stride 12 \
            --out g0032-persistence.json --plate g0032-persistence.png
      - name: Verify initial state and report any different step-240 numerical hashes
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          x=json.loads(Path('input/g0032-pilot.json').read_text())
          d=json.loads(Path('g0032-persistence.json').read_text())
          assert (d['generation'],d['n'],d['steps'],d['source_checkpoint_step'])==('0032',16,480,240)
          assert d['seeds']==x['seeds']==[42,73]
          assert d['previous_source_sha']==x['source_sha']=='6f64f3e7eb66c245385d2801306f7f039eef0d66'
          assert d['original_initialization_verified']
          assert 'restarting' not in d['edition']
          for seed in ('42','73'):
              assert set(d['hashes'][seed])=={'near_transition','separated_070'}
              for arm in d['hashes'][seed]:
                  assert d['hashes'][seed][arm]['0']==x['hashes'][seed][arm]['0']
                  matched=d['hashes'][seed][arm]['240']==x['hashes'][seed][arm]['240']
                  assert d['archived_checkpoint_bitwise_matches'][seed][arm] is matched
                  print('G0032',seed,arm,'recomputed step-240 SHA matches archived:',matched)
                  assert [row['step'] for row in d['observations'][seed][arm]]==d['times']
                  assert all(math.isfinite(row['v_active']) and
                             math.isfinite(row['w_active']) for row in d['observations'][seed][arm])
          assert set(d['both_species_active_at_extended_endpoint'])=={'42','73'}
          png=Path('g0032-persistence.png')
          assert png.stat().st_size>4096
          assert png.read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: g0032-independent-longer-horizon-screen
          path: |
            g0032-persistence.json
            g0032-persistence.png
          retention-days: 30
          if-no-files-found: error
      - name: Publish measured extension and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload atlas-media g0032-persistence.json g0032-persistence.png --clobber
