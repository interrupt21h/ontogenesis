name: G0036 Feedback Aurora art and evidence cinematics
on:
  push:
    branches: [main]
    paths:
      - 'g0036_feedback_aurora.py'
      - 'tests/test_g0036_feedback_aurora.py'
      - '.github/workflows/g0036-feedback-aurora.yml'
  workflow_dispatch:
    inputs:
      numerical_run_id:
        description: Successful G0036 matched 4D numerical workflow run
        default: '45486825879'
        type: string
  workflow_run:
    workflows: ['G0036 state-dependent 4D structural feedback pilot']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: g0036-feedback-aurora-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cinema:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned numerical and cinematic dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 matplotlib==3.10.3 pillow==11.2.1 imageio-ffmpeg==0.8.1
      - name: Verify exact source projections, clock and numeric difference tests
        run: |
          python -m compileall -q g0036_feedback_aurora.py
          python -m unittest discover -s tests -p 'test_g0036_feedback_aurora.py' -v
      - name: Fetch successful original G0036 numerical experiments
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.numerical_run_id || '45486825879' }}
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion,name \
            --jq 'if .conclusion=="success" and .name=="G0036 state-dependent 4D structural feedback pilot" then .name else error("Unverified matched numerical pilot") end'
          mkdir -p input
          for seed in 42 73; do
            gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" \
              -n "g0036-seed-${seed}-native-feedback-evidence" -D input
          done
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" \
            -n g0036-matched-structural-feedback-summary -D input
      - name: Authenticate independent native archives against the combined study
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          s=json.loads(Path('input/g0036-summary.json').read_text())
          assert s['generation']=='0036' and s['seeds']==[42,73]
          assert s['sample_steps']==list(range(0,121,12))
          for seed in (42,73):
              archive=Path(f'input/g0036-seed-{seed}.npz')
              info=json.loads(Path(f'input/g0036-seed-{seed}.json').read_text())
              digest=hashlib.sha256(archive.read_bytes()).hexdigest()
              assert digest==info['archive_sha256']==s['native_archive_sha256_by_seed'][str(seed)]
              assert info['numerical']['control']['hashes']['0']==info['numerical']['feedback']['hashes']['0']
          PY
      - name: Smoke encode original numerical comparison and art edition
        run: |
          python -u g0036_feedback_aurora.py \
            --a input/g0036-seed-42.npz --am input/g0036-seed-42.json \
            --b input/g0036-seed-73.npz --bm input/g0036-seed-73.json \
            --out /tmp/feedback-smoke --seconds 2 --fps 8
      - name: Produce original two-edition 24-second Feedback Aurora masters
        run: |
          /usr/bin/time -v python -u g0036_feedback_aurora.py \
            --a input/g0036-seed-42.npz --am input/g0036-seed-42.json \
            --b input/g0036-seed-73.npz --bm input/g0036-seed-73.json \
            --out output --seconds 24 --fps 24
      - name: Decode both masters and check distinct art / original evidence
        run: |
          python - <<'PY'
          import json,hashlib,imageio_ffmpeg
          from pathlib import Path
          posters=[]
          for edition in ('art','evidence'):
              root=Path('output/ontogenesis-0036-feedback-aurora-'+edition)
              info=json.loads(root.with_suffix('.render.json').read_text())
              assert info['generation']=='0036' and info['edition']==edition
              assert info['numerical_interpolation'] is False
              assert info['sample_steps']==list(range(0,121,12))
              for seed in (42,73):
                  sha=hashlib.sha256(Path(f'input/g0036-seed-{seed}.npz').read_bytes()).hexdigest()
                  assert info['source_archive_sha256_by_seed'][str(seed)]==sha
              movie=root.with_suffix('.mp4')
              frames,seconds=imageio_ffmpeg.count_frames_and_secs(str(movie))
              assert frames==576 and abs(seconds-24)<.1
              reader=imageio_ffmpeg.read_frames(str(movie))
              header=next(reader);reader.close()
              assert tuple(header['size'])==(1280,720)
              poster=root.with_suffix('.png')
              assert poster.stat().st_size>4096
              posters.append(hashlib.sha256(poster.read_bytes()).hexdigest())
          assert posters[0]!=posters[1]
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: g0036-feedback-aurora-art-and-evidence-films
          path: |
            output/*.mp4
            output/*.png
            output/*.render.json
          retention-days: 30
          if-no-files-found: error
      - name: Release both verified cinematic editions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload atlas-media output/*.mp4 output/*.png output/*.render.json --clobber
          echo "G0036 structural-feedback art and original-grid numerical evidence films published." >> "$GITHUB_STEP_SUMMARY"
