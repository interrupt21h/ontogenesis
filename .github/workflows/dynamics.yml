name: Generation 0004
on:
  push:
    paths:
      - dynamics.py
      - render.py
      - requirements.txt
      - .github/workflows/dynamics.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python dynamics.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -y -framerate 24 -pattern_type glob -i 'gallery/0004/[0-9]*.png' -vf scale=512:512:flags=neighbor -c:v libx264 -pix_fmt yuv420p -crf 25 -movflags +faststart gallery/0004/evolution.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: generation-0004
          path: |
            gallery/0004/evolution.mp4
            gallery/0004/metrics.json
            gallery/0004/habitat.png
            gallery/0004/08000.png
          retention-days: 30
          if-no-files-found: error
