name: Generation 0027 structural statistics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [structural_statistics.py, .github/workflows/structural-statistics.yml]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6
      - run: python -c "import numpy as np; np.show_runtime()" 
      - run: lscpu
      - run: python structural_statistics.py --n 12 --steps 240 --verify --out smoke.json
      - uses: actions/upload-artifact@v7
        with:
          name: structural-12
          path: smoke.json
  full:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy==2.2.6
      - run: python -u structural_statistics.py --verify --out result.json
      - uses: actions/upload-artifact@v7
        with:
          name: structural-24
          path: result.json
