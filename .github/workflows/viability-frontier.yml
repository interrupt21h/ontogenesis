name: G0031 population viability frontier
on:
  push:
    branches: [main]
    paths:
      - 'consolidation.py'
      - 'viability_frontier.py'
      - 'tests/test_viability_frontier.py'
      - '.github/workflows/viability-frontier.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g0031-frontier-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned numerical and plotting dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 matplotlib==3.10.3 pillow==11.2.1
      - name: Verify untouched G0026 numerical baseline and controlled rate variation
        run: |
          python -m compileall -q consolidation.py viability_frontier.py
          python -m unittest discover -s tests -p test_viability_frontier.py -v
          python -m unittest discover -s tests -p test_ecological_succession.py -v
      - name: Run matched 16^4 viable-population frontier
        run: |
          /usr/bin/time -v python -u viability_frontier.py \
            --n 16 --steps 240 --stride 6 --seeds 42,73 \
            --out g0031-pilot.json --plate g0031-pilot.png
      - name: Verify real time series and measured outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('g0031-pilot.json').read_text())
          assert (data['generation'],data['n'],data['steps'],data['seeds'])==('0031',16,240,[42,73])
          assert data['arms']=={'historical':1.,'v_loss_095':.95,'v_loss_090':.90,'v_loss_085':.85,'v_loss_080':.80}
          assert data['times'][0]==0 and data['times'][-1]==240 and len(data['times'])>=40
          for seed in ('42','73'):
              assert len({x['0'] for x in data['hashes'][seed].values()})==1
              assert all([x['step'] for x in rows]==data['times'] for rows in data['observations'][seed].values())
              assert len(data['diagnostics'][seed])==5
          png=Path('g0031-pilot.png')
          assert png.stat().st_size>4096
          assert png.read_bytes()[:8]==bytes([137,80,78,71,13,10,26,10])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: g0031-numerical-population-frontier
          path: |
            g0031-pilot.json
            g0031-pilot.png
          retention-days: 30
          if-no-files-found: error
      - name: Publish verified G0031 numerical measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload atlas-media g0031-pilot.json g0031-pilot.png --clobber
          echo '[G0031 measured pilot](https://github.com/interrupt21h/ontogenesis/releases/download/atlas-media/g0031-pilot.png)' >> "$GITHUB_STEP_SUMMARY"
