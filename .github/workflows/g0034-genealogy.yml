name: G0034 native 4D component genealogy and lineage cinema
on:
  push:
    branches: [main]
    paths:
      - 'g0034_genealogy.py'
      - 'g0034_lineage_cinema.py'
      - 'tests/test_g0034_genealogy.py'
      - 'tests/test_g0034_lineage_cinema.py'
      - '.github/workflows/g0034-genealogy.yml'
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: 'Previously completed G0033 native eight-seed evidence workflow'
        type: string
        default: '45437009050'
permissions:
  contents: read
  actions: read
concurrency:
  group: g0034-genealogy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  genealogy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pinned 4D graph and rendering dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 matplotlib==3.10.3 pillow==11.2.1 imageio-ffmpeg==0.8.1
      - name: Test true 4D wraparound components and graph renderer
        run: |
          python -m compileall -q g0034_genealogy.py g0034_lineage_cinema.py
          python -m unittest discover -s tests -p 'test_g0034_*.py' -v
      - name: Fetch successful native field evidence; never reconstruct simulation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.evidence_run_id || '45437009050' }}
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion,name \
            --jq 'if .conclusion == "success" and .name == "G0033 eight-seed native 4D interface robustness pilot" then .name else error("Unverified original G0033 run") end'
          mkdir -p input
          for seed in 42 73; do
            gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" \
              -n "g0033-seed-${seed}-native-evidence" -D input
          done
          gh release download atlas-media -p g0033-robustness.json -D input
      - name: Recheck independent numerical archive hashes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          pilot=json.loads(Path("input/g0033-robustness.json").read_text())
          assert pilot["generation"]=="0033" and pilot["seeds"]==[42,73,101,137,211,307,401,509]
          for seed in (42,73):
              p=Path(f"input/g0033-seed-{seed}")
              meta=json.loads(p.with_suffix(".native.json").read_text())
              analysis=json.loads(p.with_suffix(".analysis.json").read_text())
              digest=hashlib.sha256(p.with_suffix(".npz").read_bytes()).hexdigest()
              assert digest==meta["archive_sha256"]==analysis["source_archive_sha256"]
              assert digest==pilot["source_archive_sha256_by_seed"][str(seed)]
              assert meta["steps"]==240 and meta["n"]==16
          PY
      - name: Compute actual periodic 4D connected-component overlap genealogy
        run: |
          /usr/bin/time -v python -u g0034_genealogy.py \
            --a input/g0033-seed-42.npz --am input/g0033-seed-42.native.json \
            --b input/g0033-seed-73.npz --bm input/g0033-seed-73.native.json \
            --out g0034-genealogy.json
      - name: Verify every component count against original sampled population activity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("g0034-genealogy.json").read_text())
          assert report["times"]==list(range(0,241,24))
          assert report["seeds"]==[42,73] and report["threshold"]==0.1
          for seed in (42,73):
              original=json.loads(Path(f"input/g0033-seed-{seed}.analysis.json").read_text())
              series=report["source"][str(seed)]["arms"]
              for arm in report["arms"]:
                  for i,step in enumerate(report["times"]):
                      measured=original["observations"][arm][i]["thresholds"]["0.10"]
                      v=series[arm]["v_only"][i]
                      w=series[arm]["w_only"][i]
                      assert v["active_sites"]==measured["v_only_cells"]
                      assert w["active_sites"]==measured["w_only_cells"]
                      for record in (v,w):
                          assert record["component_count"]>=0
                          assert record["largest_component"]<=record["active_sites"]
                          assert len(record["featured"])<=24
                          assert record["births"]>=0 and record["deaths"]>=0
                          assert record["splits"]>=0 and record["merges"]>=0
          PY
      - name: Encode distinct 24-second numerical overlap genealogy cinematic
        run: |
          python -u g0034_lineage_cinema.py \
            --data g0034-genealogy.json \
            --movie ontogenesis-0034-lineage-ribbons.mp4 \
            --poster ontogenesis-0034-lineage-ribbons.png --seconds 24 --fps 24
      - name: Validate encoded film and numeric source attribution
        run: |
          python - <<'PY'
          import json,hashlib,imageio_ffmpeg
          from pathlib import Path
          base=Path("ontogenesis-0034-lineage-ribbons")
          meta=json.loads(base.with_suffix(".render.json").read_text())
          study=json.loads(Path("g0034-genealogy.json").read_text())
          assert meta["edition"]=="native-4d-overlap-genealogy-ribbon-cinematic-v1"
          assert not meta["interpolated_numerical_states"] and not meta["biological_lineages_inferred"]
          for seed in (42,73):
              archive=Path(f"input/g0033-seed-{seed}.npz")
              sha=hashlib.sha256(archive.read_bytes()).hexdigest()
              assert sha==meta["source_archive_sha256_by_seed"][str(seed)]
              assert sha==study["source"][str(seed)]["source_archive_sha256"]
          count,seconds=imageio_ffmpeg.count_frames_and_secs(str(base.with_suffix(".mp4")))
          assert count==576 and abs(seconds-24)<.1
          reader=imageio_ffmpeg.read_frames(str(base.with_suffix(".mp4")))
          header=next(reader);reader.close()
          assert tuple(header["size"])==(1280,720)
          assert base.with_suffix(".png").stat().st_size>4096
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: g0034-native-component-genealogy-and-lineage-film
          path: |
            g0034-genealogy.json
            ontogenesis-0034-lineage-ribbons.mp4
            ontogenesis-0034-lineage-ribbons.png
            ontogenesis-0034-lineage-ribbons.render.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish distinct cinematic and numerical evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload atlas-media \
            g0034-genealogy.json \
            ontogenesis-0034-lineage-ribbons.mp4 \
            ontogenesis-0034-lineage-ribbons.png \
            ontogenesis-0034-lineage-ribbons.render.json --clobber
          echo "Verified G0034 native periodic 4D components, overlap links and rendered film." >> "$GITHUB_STEP_SUMMARY"
