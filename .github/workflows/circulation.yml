name: Generation 0007
on:
  push:
    paths:
      - circulation.py
      - requirements.txt
      - .github/workflows/circulation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt scipy==1.15.3
      - run: python circulation.py
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -y -framerate 24 -pattern_type glob -i 'gallery/0007/[0-9]*.png' -vf scale=640:640 -c:v libx264 -pix_fmt yuv420p -crf 25 -movflags +faststart gallery/0007/evolution.mp4
      - uses: actions/upload-artifact@v7
        with:
          name: generation-0007
          path: |
            gallery/0007/metrics.json
            gallery/0007/02400.png
          retention-days: 30
          if-no-files-found: error
      - name: Upload standalone MP4
        id: video
        uses: actions/upload-artifact@v7
        with:
          path: gallery/0007/evolution.mp4
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Link animation
        run: echo '[Download MP4 directly](${{ steps.video.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
